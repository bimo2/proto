name: Xcode Tests + Releases

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode 26.3+
        run: |
          XCODE=$(ls /Applications | grep "Xcode_" | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s /Applications/$XCODE
          fi
          xcodebuild -version

      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build (o1-tests)
        run: |
          xcodebuild build-for-testing \
            -scheme o1-tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Test (o1-tests)
        run: |
          xcodebuild test-without-building \
          -scheme o1-tests \
          -parallel-testing-enabled NO

  release:
    needs: unit-tests
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode 26.3+
        run: |
          XCODE=$(ls /Applications | grep "Xcode_" | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s /Applications/$XCODE
          fi
          xcodebuild -version

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Code Signing (Application)
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_APPLICATION_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Code Signing (Installer)
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_INSTALLER_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          create-keychain: false

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild archive \
            -scheme o1 \
            -configuration Release \
            -archivePath o1.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application: BIMAL BHAGRATH (${DEVELOPMENT_TEAM})" \
            DEVELOPMENT_TEAM=${DEVELOPMENT_TEAM} \
            MARKETING_VERSION=${VERSION} \
            CURRENT_PROJECT_VERSION=${BUILD_NUMBER}

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath o1.xcarchive \
            -exportOptionsPlist export-options.plist \
            -exportPath .

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          xcrun notarytool store-credentials "github-actions" \
            --apple-id "$APPLE_ID" \
            --team-id "$DEVELOPMENT_TEAM" \
            --password "$APPLE_PASSWORD" \
            --validate || true
          ditto -c -k --keepParent o1.app o1.zip
          xcrun notarytool submit o1.zip --keychain-profile "github-actions" --wait
          xcrun stapler staple o1.app

      - name: Package XIP
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          xip --sign "Developer ID Installer: BIMAL BHAGRATH (${DEVELOPMENT_TEAM})" o1.app o1.xip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            o1.xip
            o1.app
